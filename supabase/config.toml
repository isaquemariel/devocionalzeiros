  # assinatura `stripe-signature`, conferida dentro da função com o
  # STRIPE_WEBHOOK_SECRET (whsec_…). Com verify_jwt ligado (o padrão), o
  # gateway recusava toda notificação antes de ela chegar à função, e nenhum
  # pagamento virava plano.
